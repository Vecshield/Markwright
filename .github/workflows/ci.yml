name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      - run: npm run build

  tier1:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest -q -m "not torch and not slow and not network"

  tier2-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python "3.12"
      - run: uv pip install -e ".[dev,synthid]" -e packages/markwright-scheme-kgw
      # Tier 2 is offline-by-construction: token-id fixtures, no model weights.
      - run: .venv/bin/pytest -q -m "not slow and not network"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markwright
          POSTGRES_PASSWORD: test
          POSTGRES_DB: markwright
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U markwright"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python "3.12"
      - run: uv pip install -e ".[dev,postgres]"
      - run: .venv/bin/pytest -q tests/test_postgres.py -m ""
