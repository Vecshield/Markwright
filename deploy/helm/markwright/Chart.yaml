apiVersion: v2
name: markwright
description: Control plane for LLM text watermarking (registry, keys, calibrated verification)
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: postgresql
    version: "15.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: minio
    version: "14.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
# values.yaml selects keyBackend: {localSealed | vaultTransit | awsKms | gcpKms | azureKeyVault | pkcs11}
# and auth.oidc.{issuer, clientId, roleClaim}. No external calls unless a cloud backend is chosen.
