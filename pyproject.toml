[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "markwright"
version = "0.1.0"
description = "Open-source control plane for LLM text watermarking: registry, keys, calibrated verification. Wraps published schemes; invents none."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "cryptography>=42",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
synthid = ["torch>=2.2", "transformers>=4.46"]
markllm = ["markllm>=0.1"]            # KGW extended variants, Unigram, EXP / EXP-Edit / ITS-Edit
vault = ["hvac>=2.1"]
oidc = ["authlib>=1.3"]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-kms>=2.21"]
azure = ["azure-keyvault-keys>=4.9", "azure-identity>=1.15"]
postgres = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "mypy", "httpx", "authlib>=1.3", "hvac>=2.1"]

[project.scripts]
markwright = "markwright.cli.main:app"

# Scheme adapters register here. Third-party schemes add their own entry point
# in their own package; the core never needs to change.
[project.entry-points."markwright.schemes"]
synthid-text = "markwright.schemes.synthid:SynthIDTextAdapter"

[project.entry-points."markwright.key_backends"]
local-sealed = "markwright.keys.local_sealed:LocalSealedVault"
vault-transit = "markwright.keys.vault_transit:VaultTransitBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/markwright"]

# Ship the wire-contract schemas and the starter null corpus inside the wheel,
# so the API/CLI/SDK validate against the same files everywhere (design §4).
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "markwright/resources/schemas"
"data/null" = "markwright/resources/null_corpora"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "torch: needs torch+transformers (tier 2; offline, no model weights)",
  "slow: full e2e with a small model download (tier 3; nightly/release)",
  "network: touches the network (excluded from CI tiers 1 and 2)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit so local runs and CI agree regardless of user-level ruff config.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B008",   # Depends(...) / typer.Option(...) in defaults IS the FastAPI/typer idiom
  "B017",   # pytest.raises(Exception) is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/test_synthid.py" = ["E402"]  # module-level torch skip must precede imports
"tests/test_kgw.py" = ["E402"]
"tests/test_vllm_plugin.py" = ["E402"]
